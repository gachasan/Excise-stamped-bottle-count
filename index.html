<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Laser Line Bottle Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

  <!-- Header -->
  <header class="text-center mb-4">
    <h1 class="text-xl font-bold text-yellow-400">ระบบนับขวดด้วย Virtual Laser Line</h1>
    <p class="text-xs text-slate-400">กวาดกล้องผ่านฝาขวด/สแตมป์แนวราบเพื่อตรวจนับ</p>
  </header>

  <!-- Container แสดงผลกล้อง -->
  <div class="relative w-full max-w-sm aspect-[3/4] bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl mb-4">
    <video id="webcam" autoplay playsinline class="hidden"></video>
    <canvas id="canvas" class="w-full h-full object-cover"></canvas>
    
    <!-- เส้น Laser จำลอง (Visual Indicator) -->
    <div id="laser-line" class="absolute top-1/2 left-0 w-full h-[2px] bg-red-500 shadow-[0_0_10px_#f00] pointer-events-none transition-colors duration-150"></div>
  </div>

  <!-- แผงควบคุมและสรุปยอด -->
  <div class="w-full max-w-sm bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
    <div class="flex justify-between items-center mb-4">
      <div>
        <span class="text-xs text-slate-400">ยอดตรวจนับปัจจุบัน</span>
        <div id="count-display" class="text-4xl font-extrabold text-green-400">0</div>
      </div>
      <button id="reset-btn" class="bg-red-600/80 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-semibold transition">
        รีเซ็ตจำนวน
      </button>
    </div>

    <!-- แผงปรับแต่งค่ากรองสีสแตมป์/ฝาขวด (HSV Threshold) -->
    <div class="space-y-3 bg-slate-900/60 p-3 rounded-lg border border-slate-700/50">
      <div class="text-xs font-bold text-slate-300 border-b border-slate-700 pb-1">ตั้งค่าสีเป้าหมาย (Hue Range)</div>
      
      <div>
        <div class="flex justify-between text-[11px] text-slate-400 mb-1">
          <span>โทนสีเริ่ม (Hue Min)</span>
          <span id="h-min-val">0</span>
        </div>
        <input type="range" id="h-min" min="0" max="360" value="0" class="w-full accent-blue-500 h-1">
      </div>

      <div>
        <div class="flex justify-between text-[11px] text-slate-400 mb-1">
          <span>โทนสีสิ้นสุด (Hue Max)</span>
          <span id="h-max-val">30</span>
        </div>
        <input type="range" id="h-max" min="0" max="360" value="30" class="w-full accent-blue-500 h-1">
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const laserLine = document.getElementById('laser-line');
    const countDisplay = document.getElementById('count-display');
    const resetBtn = document.getElementById('reset-btn');

    const hMinInput = document.getElementById('h-min');
    const hMaxInput = document.getElementById('h-max');
    const hMinVal = document.getElementById('h-min-val');
    const hMaxVal = document.getElementById('h-max-val');

    let bottleCount = 0;
    let isObjectPresent = false; // State เช็กว่าขณะนี้มีฝาขวดพาดผ่านเส้นอยู่หรือไม่

    // เปิดใช้งานกล้องมือถือ (กล้องหลัง)
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          requestAnimationFrame(processFrame);
        };
      } catch (err) {
        alert('ไม่สามารถเปิดใช้งานกล้องได้: ' + err.message);
      }
    }

    // แปลงค่า RGB เป็น HSV
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      let d = max - min;
      s = max === 0 ? 0 : d / max;

      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    // ประมวลผลภาพทีละ Frame
    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // ดึงพิกเซลเฉพาะบริเวณเส้นสแกนตรงกลางจอ (ความสูง 5 พิกเซล)
        const scanY = Math.floor(canvas.height / 2);
        const scanHeight = 5;
        const imgData = ctx.getImageData(0, scanY, canvas.width, scanHeight);
        const pixels = imgData.data;

        let detectedPixels = 0;
        const minHue = parseFloat(hMinInput.value);
        const maxHue = parseFloat(hMaxInput.value);

        // วนลูปตรวจพิกเซลบนเส้นสแกน
        for (let i = 0; i < pixels.length; i += 4) {
          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];

          const [h, s, v] = rgbToHsv(r, g, b);

          // ตรวจสอบว่าสีอยู่ในช่วงที่กำหนด และมีความสดของสี (Saturation > 20%, Value > 20%) หรือไม่
          let matchColor = false;
          if (minHue <= maxHue) {
            matchColor = (h >= minHue && h <= maxHue);
          } else { // กรณีช่วงสีข้ามฝั่ง 360 ดำเนินการเช็กหมุนวน (เช่น สีแดง)
            matchColor = (h >= minHue || h <= maxHue);
          }

          if (matchColor && s > 20 && v > 20) {
            detectedPixels++;
          }
        }

        // หากมีจำนวนพิกเซลสีที่ตรงเงื่อนไขเกิน 15% ของความกว้างเส้นสแกน
        const thresholdPixels = (canvas.width * scanHeight) * 0.15;
        const targetDetected = detectedPixels > thresholdPixels;

        // Debounce Logic: นับเมื่อเกิดการข้ามผ่าน (Transition จาก "เจอวัตถุ" -> "พ้นวัตถุ")
        if (targetDetected && !isObjectPresent) {
          isObjectPresent = true;
          laserLine.classList.remove('bg-red-500', 'shadow-[0_0_10px_#f00]');
          laserLine.classList.add('bg-green-400', 'shadow-[0_0_12px_#0f0]');
        } else if (!targetDetected && isObjectPresent) {
          isObjectPresent = false;
          bottleCount++;
          countDisplay.innerText = bottleCount;

          laserLine.classList.remove('bg-green-400', 'shadow-[0_0_12px_#0f0]');
          laserLine.classList.add('bg-red-500', 'shadow-[0_0_10px_#f00]');
        }
      }
      requestAnimationFrame(processFrame);
    }

    // Event Listeners ปรับค่า UI
    hMinInput.addEventListener('input', (e) => hMinVal.innerText = e.target.value);
    hMaxInput.addEventListener('input', (e) => hMaxVal.innerText = e.target.value);
    resetBtn.addEventListener('click', () => {
      bottleCount = 0;
      countDisplay.innerText = '0';
    });

    initCamera();
  </script>
</body>
</html>
