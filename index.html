<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Excise Bottle Counter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Noto Sans Thai",system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button,input{font:inherit}

/* Excise palette */
:root{
  --ex-blue:#1a4f96;
  --ex-blue-deep:#0f3570;
  --ex-blue-light:rgba(26,79,150,.18);
  --ex-gray:#7a8fa8;
  --ex-gray-light:rgba(122,143,168,.15);
  --ex-amber:#e8a020;
  --ex-amber-glow:rgba(232,160,32,.22);
  --ex-white:rgba(255,255,255,.92);
  --glass-bg:rgba(8,18,42,.78);
  --glass-border:rgba(26,79,150,.35);
}

/* FULLSCREEN VIDEO */
.stage{position:fixed;inset:0;background:#000}
video{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:center center}

/* TOP BAR */
.topbar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}

/* Brand pill — logo + name */
.brand-pill{display:flex;align-items:center;gap:9px;background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:22px;padding:6px 14px 6px 8px}
.brand-logo{height:28px;width:auto;opacity:.95;flex-shrink:0}
.brand-divider{width:1px;height:18px;background:rgba(26,79,150,.4);flex-shrink:0}
.brand-text{display:flex;flex-direction:column;gap:0}
.brand-name{font-size:12px;font-weight:700;color:var(--ex-white);letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:9px;font-weight:500;color:var(--ex-gray);letter-spacing:.04em;line-height:1.2}

/* Camera state pill */
.live-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:rgba(255,255,255,.4);background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:6px 12px;letter-spacing:.03em}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ex-gray);flex-shrink:0}
.live-pill.on{color:rgba(120,200,160,.9);border-color:rgba(52,180,120,.22)}
.live-pill.on .live-dot{background:#4ade80}

/* CENTER ROI */
.roi-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none}
.roi{border:2px solid rgba(26,79,150,.55);border-radius:50%;box-shadow:0 0 0 9999px rgba(0,5,20,.3);transition:border-color .22s,box-shadow .22s;display:flex;align-items:center;justify-content:center;position:relative}
/* Corner tick marks */
.roi::before,.roi::after{display:none}
.roi-inner{width:6px;height:6px;border-radius:50%;background:rgba(26,79,150,.7);position:absolute}
.roi.locked{border-color:rgba(26,79,150,.85);border-style:dashed;box-shadow:0 0 0 9999px rgba(0,5,20,.3),0 0 0 1px rgba(26,79,150,.2)}
.roi.detected{border-color:var(--ex-amber);border-style:solid;box-shadow:0 0 0 9999px rgba(0,5,20,.28),0 0 22px var(--ex-amber-glow)}
.roi.detected .roi-inner{background:var(--ex-amber)}

/* COUNT — above ROI */
.count-badge{position:fixed;top:50%;left:50%;transform:translate(-50%,-185%);z-index:20;pointer-events:none;text-align:center}
.count-num{font-size:76px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.05em;text-shadow:0 0 40px rgba(26,79,150,.5),0 2px 20px rgba(0,0,0,.7)}
.count-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.38);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}

/* CAPTURE TOAST */
.toast{position:fixed;left:50%;top:25%;transform:translate(-50%,-50%) scale(.93);opacity:0;z-index:30;pointer-events:none;background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-border);color:#fff;border-radius:16px;padding:12px 20px;font-weight:700;font-size:13px;text-align:center;transition:opacity .14s,transform .14s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast-accent{color:var(--ex-amber)}
.toast-sub{display:block;font-size:10px;color:var(--ex-gray);margin-top:3px;font-weight:500}

/* GRAPH — inside glass panel, right side of screen, vertical */
.graph-panel{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:52px}
.graph-label{font-size:9px;font-weight:600;color:var(--ex-gray);letter-spacing:.05em;text-align:center}
.graph-canvas-wrap{background:rgba(8,18,42,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:12px;padding:6px 5px;width:52px}
.graph-canvas-wrap canvas{display:block}

/* METER — inside graph panel */
.meter-row{display:flex;align-items:flex-end;gap:4px;justify-content:center}
.meter{width:5px;height:100px;border-radius:3px;background:rgba(255,255,255,.07);position:relative;overflow:visible;flex-shrink:0}
.meter-fill{position:absolute;bottom:0;width:100%;border-radius:3px;background:var(--ex-blue);transition:height .08s}
.meter-base{position:absolute;left:-3px;width:11px;height:1.5px;background:var(--ex-amber)}
.meter-peak{position:absolute;left:-3px;width:11px;height:1.5px;background:rgba(255,255,255,.4)}
.meter-val{font-size:9px;font-weight:700;color:var(--ex-white);letter-spacing:.01em;text-align:center;min-width:28px}

/* INFO — left side */
.info-overlay{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:20;pointer-events:none;background:rgba(8,18,42,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:4px}
.info-row{font-size:9px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.info-row b{color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}

/* BOTTOM CONTROLS */
.controls{position:fixed;bottom:env(safe-area-inset-bottom,0);left:0;right:0;z-index:20;padding:0 12px 14px}
.ctrl-glass{background:var(--glass-bg);backdrop-filter:blur(32px) saturate(1.9);-webkit-backdrop-filter:blur(32px) saturate(1.9);border:1px solid var(--glass-border);border-radius:22px;padding:13px 15px;display:flex;flex-direction:column;gap:11px}

/* Excise blue accent line at top of panel */
.ctrl-glass::before{content:"";display:block;height:2px;background:linear-gradient(90deg,transparent,var(--ex-blue) 30%,rgba(26,79,150,.4) 70%,transparent);border-radius:2px;margin:-13px -15px 0;margin-bottom:11px}

.status-row{display:flex;align-items:center;justify-content:space-between}
.debug{display:flex;gap:10px;flex-wrap:wrap}
.debug-item{font-size:9px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.04em}
.debug-item b{color:rgba(255,255,255,.55)}
.status-text{font-size:11px;font-weight:600;color:var(--ex-gray);text-align:right;letter-spacing:.01em}

/* Buttons */
.btn-row{display:flex;gap:9px}
.btn{border:0;border-radius:13px;padding:12px;font-weight:700;font-size:13px;flex:1;transition:transform .1s,opacity .15s;letter-spacing:-.01em;cursor:pointer}
.btn:active{transform:scale(.96);opacity:.85}
.btn-lock{background:var(--ex-blue);color:#fff}
.btn-lock.active{background:rgba(200,70,70,.85);color:#fff}
.btn-reset{background:var(--ex-gray-light);color:var(--ex-white);border:1px solid rgba(255,255,255,.08)}

/* Sliders */
.sliders{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.slider-group{display:flex;flex-direction:column;gap:5px}
.slider-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between}
.slider-label b{color:rgba(255,255,255,.6);font-weight:700}
input[type=range]{width:100%;accent-color:var(--ex-blue);cursor:pointer}

/* Zoom badge */
.zoom-badge{position:fixed;bottom:calc(env(safe-area-inset-bottom,0) + 195px);left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:10px;padding:4px 10px;font-size:11px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:.04em;opacity:0;transition:opacity .3s}
.zoom-badge.show{opacity:1}

@media(max-width:400px){
  .count-num{font-size:60px}
  .sliders{grid-template-columns:1fr 1fr}
  .sliders .slider-group:last-child{grid-column:span 2}
  .brand-sub{display:none}
}
</style>
</head>
<body>

<div class="stage">
  <video id="webcam" autoplay playsinline muted></video>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand-pill">
    <img id="brandLogo" class="brand-logo" alt="กรมสรรพสามิต">
    <div class="brand-divider"></div>
    <div class="brand-text">
      <div class="brand-name">Bottle Counter</div>
      <div class="brand-sub">กรมสรรพสามิต</div>
    </div>
  </div>
  <div id="cameraState" class="live-pill"><div class="live-dot"></div>OFF</div>
</div>

<!-- ROI -->
<div class="roi-wrap">
  <div id="roi" class="roi" style="width:110px;height:110px">
    <div class="roi-inner"></div>
  </div>
</div>

<!-- COUNT -->
<div class="count-badge">
  <div id="count" class="count-num">0</div>
  <div class="count-sub">ขวดที่ตรวจพบ</div>
</div>

<!-- TOAST -->
<div id="captureToast" class="toast"></div>

<!-- INFO LEFT -->
<div class="info-overlay">
  <div class="info-row">SIM <b id="scoreText">–</b></div>
  <div class="info-row">BASE <b id="baseText">–</b></div>
  <div class="info-row">PEAK <b id="peakText">–</b></div>
  <div class="info-row">DELTA <b id="deltaText">–</b></div>
</div>

<!-- GRAPH + METER — right panel -->
<div class="graph-panel">
  <div class="graph-label">SIGNAL</div>
  <div class="graph-canvas-wrap">
    <canvas id="graph" width="42" height="90"></canvas>
  </div>
  <div class="meter-row">
    <div class="meter">
      <div id="fill" class="meter-fill"></div>
      <div id="baseLine" class="meter-base"></div>
      <div id="peakLine" class="meter-peak"></div>
    </div>
  </div>
  <div id="verticalScore" class="meter-val">–</div>
</div>

<!-- ZOOM BADGE -->
<div id="zoomBadge" class="zoom-badge">1.0×</div>

<!-- BOTTOM CONTROLS -->
<div class="controls">
  <div class="ctrl-glass">
    <div class="status-row">
      <div class="debug">
        <span class="debug-item">STATE <b id="stateDebug">IDLE</b></span>
        <span class="debug-item">CONF <b id="confDebug">–</b></span>
        <span class="debug-item">EV <b id="eventDebug">0</b></span>
      </div>
      <div id="status" class="status-text">เปิดกล้องเพื่อเริ่ม</div>
    </div>
    <div class="btn-row">
      <button id="lockBtn" class="btn btn-lock">ล็อก Reference</button>
      <button id="resetBtn" class="btn btn-reset">รีเซ็ต</button>
    </div>
    <div class="sliders">
      <div class="slider-group">
        <div class="slider-label">วงกลม <b id="sizeLabel">110</b></div>
        <input id="sizeSlider" type="range" min="50" max="180" step="5" value="110">
      </div>
      <div class="slider-group">
        <div class="slider-label">ความไว <b id="sensLabel">กลาง</b></div>
        <input id="sensSlider" type="range" min="0" max="2" step="1" value="1">
      </div>
      <div class="slider-group">
        <div class="slider-label">ซูม <b id="zoomLabel">1.0×</b></div>
        <input id="zoomSlider" type="range" min="100" max="400" step="10" value="100">
      </div>
    </div>
  </div>
</div>

let track=null, scanning=false, template=null, count=0;
let roiSize=110, state="IDLE", baseline=8, smooth=8, peak=8, peakDelta=0;
let history=[], lastCountTime=0, eventCount=0, audioCtx=null;
let referenceFrames=[], refCaptureLeft=0, refTargetFrames=4, refCaptureBusy=false;
let refCaptureTimer=null, refCaptureStartedAt=0, refCaptureIntervalMs=120, refCaptureMaxMs=2200;
let currentZoom=1.0, zoomTimer=null;
// Flag: should we count the reference bottle itself when scanning starts?
let countFirstBottle=false;

const sensitivity=[
  {name:"ต่ำ",  rise:8, minPeakDelta:12, fall:0.58, minWidth:5, rearm:5},
  {name:"กลาง", rise:6, minPeakDelta:9,  fall:0.62, minWidth:4, rearm:5},
  {name:"สูง",  rise:4, minPeakDelta:7,  fall:0.68, minWidth:3, rearm:4}
];
function cfg(){return sensitivity[+sensSlider.value]}

function beep(freq=880,dur=.09){
  try{
    audioCtx||=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq;g.gain.value=.07;o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function updateROI(){
  roiSize=+sizeSlider.value;
  roi.style.width=roi.style.height=roiSize+"px";
  offscreen.width=roiSize;offscreen.height=roiSize;
  $("sizeLabel").textContent=roiSize;
}
function updateSens(){$("sensLabel").textContent=cfg().name}

async function applyZoom(val){
  currentZoom=val/100;
  const label=currentZoom.toFixed(1)+"×";
  $("zoomLabel").textContent=label;
  $("zoomBadge").textContent=label;
  $("zoomBadge").classList.add("show");
  clearTimeout(zoomTimer);
  zoomTimer=setTimeout(()=>$("zoomBadge").classList.remove("show"),1400);
  if(!track)return;
  const caps=track.getCapabilities&&track.getCapabilities();
  if(caps&&caps.zoom&&caps.zoom.min!=null){
    const zMin=caps.zoom.min,zMax=caps.zoom.max;
    const zTarget=zMin+(zMax-zMin)*((currentZoom-1)/3);
    try{await track.applyConstraints({advanced:[{zoom:Math.min(zMax,Math.max(zMin,zTarget))}]});}catch(e){}
  }else{
    video.style.transform=currentZoom>1?`scale(${currentZoom})`:"";
  }
}
zoomSlider.oninput=()=>applyZoom(+zoomSlider.value);
sizeSlider.oninput=updateROI;
sensSlider.oninput=updateSens;
updateROI();updateSens();

async function initCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false
    });
    video.srcObject=stream;await video.play();
    track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities&&track.getCapabilities();
    if(caps&&caps.zoom&&caps.zoom.max){
      zoomSlider.max=Math.min(Math.round(caps.zoom.max*100),600);
    }
    $("cameraState").innerHTML='<div class="live-dot"></div>ON';
    $("cameraState").classList.add("on");
    requestAnimationFrame(loop);
  }catch(e){
    $("status").textContent="ไม่สามารถเปิดกล้อง: "+e.message;
  }
}

function circularImage(){
  const s=roiSize,sx=video.videoWidth/2-s/2,sy=video.videoHeight/2-s/2;
  ctx.clearRect(0,0,s,s);ctx.save();
  ctx.beginPath();ctx.arc(s/2,s/2,s/2,0,Math.PI*2);ctx.clip();
  ctx.drawImage(video,sx,sy,s,s,0,0,s,s);ctx.restore();
  return ctx.getImageData(0,0,s,s);
}

function features(img){
  const d=img.data,s=img.width,hist=new Array(64).fill(0);
  let n=0,sum=0,sum2=0,edge=0;
  for(let y=1;y<s-1;y++)for(let x=1;x<s-1;x++){
    const dx=x-s/2,dy=y-s/2;if(dx*dx+dy*dy>(s/2-2)**2)continue;
    const i=(y*s+x)*4,r=d[i],gg=d[i+1],b=d[i+2];
    hist[((r>>6)<<4)|((gg>>6)<<2)|(b>>6)]++;
    const l=.299*r+.587*gg+.114*b;sum+=l;sum2+=l*l;n++;
    const l1=.299*d[i-4]+.587*d[i-3]+.114*d[i-2];
    const l2=.299*d[i+s*4]+.587*d[i+s*4+1]+.114*d[i+s*4+2];
    if(Math.abs(l-l1)+Math.abs(l-l2)>70)edge++;
  }
  hist.forEach((v,i)=>hist[i]=v/n);
  const mean=sum/n,variance=Math.max(0,sum2/n-mean*mean);
  return{hist,mean,sd:Math.sqrt(variance),edge:edge/n};
}

function histSim(a,b){let s=0;for(let i=0;i<64;i++)s+=Math.min(a[i],b[i]);return s*100}
function featureScore(a,b){
  return .55*histSim(a.hist,b.hist)
        +.20*Math.max(0,100-Math.abs(a.mean-b.mean)*1.35)
        +.15*Math.max(0,100-Math.abs(a.sd-b.sd)*1.6)
        +.10*Math.max(0,100-Math.abs(a.edge-b.edge)*600);
}
function smoothScore(v){smooth=smooth*.72+v*.28;return smooth}

function showCaptureToast(title,sub="",capturing=false){
  const el=$("captureToast");
  el.innerHTML=title+(sub?`<span class="toast-sub">${sub}</span>`:"");
  el.classList.toggle("capturing",capturing);
  el.classList.add("show");
}
function hideCaptureToast(){$("captureToast").classList.remove("show","capturing")}

function captureReference(){
  if(refCaptureBusy)return;
  if(!video.videoWidth||!video.videoHeight){$("status").textContent="รอกล้องพร้อมก่อน";return}
  refCaptureBusy=true;referenceFrames=[];refTargetFrames=4;refCaptureLeft=4;
  refCaptureStartedAt=performance.now();
  roi.classList.add("locked");lockBtn.textContent="กำลังล็อก…";lockBtn.disabled=true;
  showCaptureToast("กำลังล็อก Reference","เก็บภาพ 1/4",true);
  $("status").textContent="กำลังเก็บ Reference…";beep();
  const grab=()=>{
    if(!refCaptureBusy)return;
    if(video.readyState>=video.HAVE_CURRENT_DATA&&video.videoWidth){
      const f=features(circularImage());
      if(f){
        referenceFrames.push(f);
        const done=referenceFrames.length;refCaptureLeft=Math.max(0,refTargetFrames-done);
        if(done<refTargetFrames){
          lockBtn.textContent=`${done}/${refTargetFrames}`;
          showCaptureToast("กำลังล็อก Reference",`เก็บภาพ ${done+1}/${refTargetFrames}`,true);
          $("status").textContent=`กำลังเก็บ… ${done}/${refTargetFrames}`;
        }else{finishReference();return}
      }
    }
    if(performance.now()-refCaptureStartedAt>=refCaptureMaxMs){
      if(referenceFrames.length>=2)finishReference();else failReference();return;
    }
    refCaptureTimer=setTimeout(grab,refCaptureIntervalMs);
  };
  grab();
}

function failReference(){
  if(refCaptureTimer){clearTimeout(refCaptureTimer);refCaptureTimer=null;}
  refCaptureBusy=false;refCaptureLeft=0;referenceFrames=[];
  roi.classList.remove("locked");lockBtn.disabled=false;lockBtn.textContent="ล็อก Reference";
  $("status").textContent="ล็อกไม่สำเร็จ ลองใหม่";
  showCaptureToast("ล็อกไม่สำเร็จ","กดปุ่มเพื่อลองใหม่");
  setTimeout(hideCaptureToast,1200);
}

function finishReference(){
  if(refCaptureTimer){clearTimeout(refCaptureTimer);refCaptureTimer=null;}
  const f=referenceFrames;
  if(f.length<2){
    refCaptureBusy=false;refCaptureLeft=0;lockBtn.disabled=false;hideCaptureToast();
    $("status").textContent="ล็อกไม่สำเร็จ ลองใหม่";return;
  }
  template={
    hist:Array.from({length:64},(_,i)=>f.reduce((a,x)=>a+x.hist[i],0)/f.length),
    mean:f.reduce((a,x)=>a+x.mean,0)/f.length,
    sd:f.reduce((a,x)=>a+x.sd,0)/f.length,
    edge:f.reduce((a,x)=>a+x.edge,0)/f.length
  };
  baseline=Math.min(...f.map(x=>featureScore(template,x)));
  if(!isFinite(baseline))baseline=8;
  smooth=baseline;peak=baseline;peakDelta=0;history=[];
  referenceFrames=[];refCaptureLeft=0;refCaptureBusy=false;

  // Count the reference bottle itself as #1
  count++;eventCount++;lastCountTime=performance.now();
  $("count").textContent=count;
  // Mark that we need to wait for the first "leave" before entering PEAK state again
  countFirstBottle=true;

  scanning=true;
  // Start in PEAK so that moving away triggers FALLING → count
  // Actually: start in a special "INVIEW" state — we set state to PEAK immediately
  // so the detector knows the bottle is currently in view and counts when it leaves.
  state="PEAK";peak=baseline+20;peakDelta=20;

  lockBtn.disabled=false;lockBtn.textContent="หยุดสแกน";lockBtn.classList.add("active");
  roi.classList.add("locked");roi.classList.add("detected");
  $("status").textContent="กำลังสแกน — เลื่อนขวดออก";
  showCaptureToast(`<span class="toast-accent">✓</span> นับแล้ว 1 ขวด`,`${f.length} frames • เลื่อนออก→นับต่อ`);
  setTimeout(hideCaptureToast,1400);beep(660,.06);
}

function processEvent(score){
  const c=cfg(),prev=history.length?history[history.length-1]:score;
  const falling=prev-score>=0;
  if(state==="IDLE"){
    if(score>baseline+c.rise){state="RISING";peak=score;peakDelta=score-baseline}
  }else if(state==="RISING"){
    if(score>peak){peak=score;peakDelta=peak-baseline}
    if(falling&&peakDelta>=c.minPeakDelta)state="PEAK";
    else if(score<baseline+c.rearm)state="IDLE";
  }else if(state==="PEAK"){
    if(score>peak){peak=score;peakDelta=peak-baseline}
    if(score<peak*c.fall&&peakDelta>=c.minPeakDelta)state="FALLING";
  }else if(state==="FALLING"){
    if(score>peak*.93){state="PEAK";return}
    if(score<=baseline+c.rearm){
      const now=performance.now();
      if(now-lastCountTime>250){
        count++;eventCount++;lastCountTime=now;
        $("count").textContent=count;
        beep();
      }
      state="IDLE";peak=score;peakDelta=0;
      roi.classList.remove("detected");
      countFirstBottle=false;
    }
  }
  roi.classList.toggle("detected",state!=="IDLE");
}

function drawGraph(){
  const w=graph.width,h=graph.height;
  gctx.clearRect(0,0,w,h);
  if(history.length<2)return;
  // Baseline line
  gctx.strokeStyle="rgba(232,160,32,.35)";gctx.lineWidth=1;gctx.setLineDash([2,3]);
  const by=h-1-(Math.max(0,Math.min(100,baseline))/100)*(h-2);
  gctx.beginPath();gctx.moveTo(0,by);gctx.lineTo(w,by);gctx.stroke();
  gctx.setLineDash([]);
  // Signal line
  gctx.strokeStyle="rgba(26,79,150,.9)";gctx.lineWidth=1.5;gctx.beginPath();
  history.forEach((v,i)=>{
    const x=i*(w/(history.length-1));
    const y=h-1-(Math.max(0,Math.min(100,v))/100)*(h-2);
    i?gctx.lineTo(x,y):gctx.moveTo(x,y);
  });
  gctx.stroke();
}

function loop(){
  if(video.readyState>=video.HAVE_ENOUGH_DATA){
    const f=features(circularImage());
    if(scanning&&template){
      const raw=featureScore(template,f);
      const score=smoothScore(raw);
      if(state==="IDLE")baseline=baseline*.985+score*.015;
      processEvent(score);
      history.push(score);if(history.length>90)history.shift();
      peak=Math.max(peak,score);peakDelta=Math.max(0,peak-baseline);
      const sr=Math.round(score)+"%";
      $("scoreText").textContent=sr;$("verticalScore").textContent=sr;
      $("baseText").textContent=Math.round(baseline)+"%";
      $("peakText").textContent=Math.round(peak)+"%";
      $("deltaText").textContent="+"+Math.round(peakDelta)+"%";
      $("stateDebug").textContent=state;
      $("confDebug").textContent=Math.round(Math.min(100,peakDelta*4))+"%";
      $("eventDebug").textContent=eventCount;
      $("fill").style.height=Math.min(100,score)+"%";
      $("baseLine").style.bottom=Math.min(100,baseline)+"%";
      $("peakLine").style.bottom=Math.min(100,peak)+"%";
      drawGraph();
    }
  }
  requestAnimationFrame(loop);
}

lockBtn.onclick=()=>{
  if(!scanning){
    if(!video.videoWidth){$("status").textContent="รอกล้องพร้อมก่อน";return}
    captureReference();
  }else{
    scanning=false;template=null;state="IDLE";history=[];referenceFrames=[];
    refCaptureLeft=0;refCaptureBusy=false;countFirstBottle=false;
    if(refCaptureTimer){clearTimeout(refCaptureTimer);refCaptureTimer=null;}
    roi.className="roi";roi.innerHTML='<div class="roi-inner"></div>';
    hideCaptureToast();lockBtn.disabled=false;
    lockBtn.textContent="ล็อก Reference";lockBtn.classList.remove("active");
    $("status").textContent="หยุดการสแกน";
    ["scoreText","baseText","peakText","deltaText","verticalScore"].forEach(id=>$(id).textContent="–");
    $("confDebug").textContent="–";
  }
};
resetBtn.onclick=()=>{count=0;eventCount=0;$("count").textContent="0";$("eventDebug").textContent="0"};

document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey||e.deltaX!==0||e.deltaY!==0)e.preventDefault()},{passive:false});
document.addEventListener("touchmove",e=>{
  if(e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON")e.preventDefault();
},{passive:false});

window.addEventListener("DOMContentLoaded",initCamera);
</script>
</body>
</html>
