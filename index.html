<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Template Counter (Circle Upgrade)</title>
    <!-- โหลด OpenCV.js มาประมวลผลจับคู่ภาพ -->
    <script async src="https://opencv.org" id="opencv-js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .counter-box { font-size: 3rem; font-weight: bold; color: #00ffcc; margin: 10px 0; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        #videoContainer { position: relative; width: 100%; max-width: 400px; margin: 15px auto; aspect-ratio: 4/3; background: #000; border-radius: 10px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; font-size: 1rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-prime { background: #00ffcc; color: #1a1a1a; }
        .btn-sec { background: #444; color: #fff; }
        button:active { transform: scale(0.98); }
        .slider-group { margin: 15px 0; text-align: left; background: #383838; padding: 10px; border-radius: 8px; }
        .slider-group label { display: block; font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .slider-group input { width: 100%; }
        #targetCanvas { border: 2px dashed #00ffcc; border-radius: 50%; display: none; margin: 10px auto; width: 80px; height: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Template Counter 🍾</h2>
    <p style="color: #aaa; font-size: 0.9rem;">ระบบสแกนนับอัตโนมัติ (เวอร์ชันครอบวงกลมตัดพื้นหลัง)</p>
    
    <div class="counter-box" id="countNumber">0</div>
    <div style="font-size: 0.9rem; color: #00ffcc; margin-bottom: 10px;">ความเหมือนในเฟรม: <span id="simScore">0%</span></div>

    <div id="videoContainer">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <canvas id="targetCanvas"></canvas>

    <div class="controls">
        <button class="btn-prime" id="lockBtn">🔒 ล็อกเป้าหมาย (ฝาขวดแรก)</button>
        <button class="btn-sec" id="resetBtn">🔄 รีเซ็ตระบบนับ</button>
    </div>

    <!-- แผงควบคุมสไลเดอร์เหมือนตัวแอปเดิมของคุณ -->
    <div class="slider-group">
        <label>ขนาดกรอบเป้าหมาย: <span id="sizeVal">80</span>px</label>
        <input type="range" id="sizeSlider" min="40" max="150" value="80">
    </div>

    <div class="slider-group">
        <label>ซูมกล้อง (Digital Zoom): <span id="zoomVal">1.0</span>x</label>
        <input type="range" id="zoomSlider" min="10" max="30" value="10">
    </div>
</div>

<script>
    const video = document.getElementById('videoInput');
    const canvas = document.getElementById('canvasOutput');
    const ctx = canvas.getContext('2d');
    const targetCanvas = document.getElementById('targetCanvas');
    const tCtx = targetCanvas.getContext('2d');
    
    let track = null;
    let openCvReady = false;
    let isLocked = false;
    let bottleCount = 0;
    let state = "OUT"; // ตรรกะ State Machine ป้องกันการนับซ้ำ (IN = เจอขวด, OUT = พ้นขวด)
    
    // พารามิเตอร์เก็บรูปภาพอ้างอิงของ OpenCV.js
    let templateMat = null;
    let maskMat = null; 

    // โหลด OpenCV สำเร็จ
    document.getElementById('opencv-js').addEventListener('load', () => {
        openCvReady = true;
        initCamera();
    });

    // 1. เปิดกล้องและสั่งเปิดแฟลชอัตโนมัติ (สำหรับระบบที่รองรับ)
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            video.srcObject = stream;
            
            // พยายามเปิดแฟลช (Torch) อัตโนมัติ
            track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();
            if (capabilities.torch) {
                await track.applyConstraints({ advanced: [{ torch: true }] });
            }
            
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                requestAnimationFrame(processFrame);
            });
        } catch (err) {
            alert("ไม่สามารถเข้าถึงกล้องหลังได้: " + err);
        }
    }

    // สไลเดอร์อัปเดตค่าความกว้างกรอบเล็ง
    const sizeSlider = document.getElementById('sizeSlider');
    sizeSlider.addEventListener('input', (e) => { document.getElementById('sizeVal').innerText = e.target.value; });
    const zoomSlider = document.getElementById('zoomSlider');
    zoomSlider.addEventListener('input', (e) => { document.getElementById('zoomVal').innerText = (e.target.value/10).toFixed(1); });

    // 2. ฟังก์ชันล็อกเป้าหมาย (สร้างภาพอ้างอิงแบบ "วงกลมสแตมป์")
    document.getElementById('lockBtn').addEventListener('click', () => {
        if (!openCvReady) return;
        
        const size = parseInt(sizeSlider.value);
        const x = (canvas.width - size) / 2;
        const y = (canvas.height - size) / 2;

        // สกัดภาพตรงกลางจอกรอบสี่เหลี่ยมออกมาเป็นภาพดิบก่อน
        const rawData = ctx.getImageData(x, y, size, size);
        targetCanvas.width = size;
        targetCanvas.height = size;
        
        // ใช้ Canvas เสริมสร้างมาสก์ "วงกลม" ครอบลงไป เพื่อรีเซ็ตพิกเซลนอกวงกลมให้กลายเป็นสีดำ
        tCtx.clearRect(0,0,size,size);
        tCtx.save();
        tCtx.beginPath();
        tCtx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
        tCtx.clip(); // บังคับตัดพื้นที่ส่วนที่เหลือให้โปร่งแสง
        
        // วาดภาพสี่เหลี่ยมลงบนขอบเขตหน้ากากวงกลม
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = size; tempCanvas.height = size;
        tempCanvas.getContext('2d').putImageData(rawData, 0, 0);
        tCtx.drawImage(tempCanvas, 0, 0);
        tCtx.restore();

        // นำภาพวงกลมที่ได้แปลงเข้าสู่ระนาบหน่วยความจำ OpenCV.js
        if(templateMat) templateMat.delete();
        if(maskMat) maskMat.delete();

        const finalImgData = tCtx.getImageData(0, 0, size, size);
        templateMat = cv.matFromImageData(finalImgData);
        
        // สร้างมาสก์สีขาว-ดำ (Grayscale) เพื่อบอกคำสั่ง matchTemplate ให้คิดเฉพาะส่วนสีขาวในวงกลม
        maskMat = new cv.Mat();
        cv.cvtColor(templateMat, maskMat, cv.COLOR_RGBA2GRAY);
        cv.threshold(maskMat, maskMat, 1, 255, cv.THRESH_BINARY); // ทุกพิกเซลที่ไม่ใช่สีดำรอบนอกจะถูกนับเป็นพิกเซลใช้งาน

        targetCanvas.style.display = "block";
        isLocked = true;
        document.getElementById('lockBtn').innerText = "🔒 ล็อกเป้าหมายแล้ว";
    });

    // รีเซ็ตตัวเลขนับ
    document.getElementById('resetBtn').addEventListener('click', () => {
        bottleCount = 0;
        document.getElementById('countNumber').innerText = bottleCount;
        state = "OUT";
    });

    // 3. ฟังก์ชันประมวลผลวิดีโอเรียลไทม์ และระบบ State Machine
    function processFrame() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const size = parseInt(sizeSlider.value);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // วาดวงกลมเล็งเป้าสีเขียวตรงกลางหน้าจอให้สอดคล้องกับขนาดสไลเดอร์ เพื่อให้ทาบฝาขวดง่ายๆ
            ctx.beginPath();
            ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
            ctx.strokeStyle = isLocked ? "#00ffcc" : "#ff3333";
            ctx.lineWidth = 3;
            ctx.stroke();

            // ทำตรรกะ Match Template เมื่อมีการกดล็อกฝาขวดไปแล้ว
            if (isLocked && templateMat && maskMat) {
                let srcMat = cv.matFromImageData(ctx.getImageData((canvas.width-size*2)/2, (canvas.height-size*2)/2, size*2, size*2)); // ครอบพื้นที่สแกนใหญ่เป็น 2 เท่ารอบเป้ากลาง
                let resMat = new cv.Mat();
                
                try {
                    // ใช้เทคนิคจับคู่ภาพระดับสูงแบบมีมาสก์วงกลมตัดพิกเซลแวดล้อมขอบทิ้ง (TM_CCORR_NORMED คัดแยกสีและลายได้ดีที่สุด)
                    cv.matchTemplate(srcMat, templateMat, resMat, cv.TM_CCORR_NORMED, maskMat);
                    let minMax = cv.minMaxLoc(resMat);
                    let matchScore = minMax.maxVal * 100; // ค่าความเหมือนเป็นเปอร์เซ็นต์ (0 - 100%)
                    
                    document.getElementById('simScore').innerText = matchScore.toFixed(0) + "%";

                    // ตรรกะความเหมือนเด้งขึ้นและลดลง (State Machine แบบที่คุณต้องการ)
                    const ACC_THRESHOLD = 88; // ค่าความเหมือนขั้นต่ำที่ตัดสินว่าเจอฝาขวด (ปรับลด/เพิ่มได้ตามแสงหน้างาน)
                    const DROP_THRESHOLD = 75; // ค่าที่แปลว่าเลื่อนพ้นขวดไปแล้ว

                    if (matchScore >= ACC_THRESHOLD && state === "OUT") {
                        bottleCount++;
                        document.getElementById('countNumber').innerText = bottleCount;
                        state = "IN"; // ตรึงสถานะไว้ว่ากำลังผ่านขวดอยู่ ไม่ให้นับซ้ำ
                    } else if (matchScore < DROP_THRESHOLD && state === "IN") {
                        state = "OUT"; // ปลดล็อกสถานะเมื่อเลื่อนพ้นขวดแล้ว เพื่อรอขวดถัดไป
                    }

                } catch (e) { console.error(e); }
                
                srcMat.delete(); resMat.delete();
            }
        }
