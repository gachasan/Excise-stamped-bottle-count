<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Excise Bottle Counter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Noto Sans Thai",system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button,input{font:inherit}

/* FULLSCREEN VIDEO */
.stage{position:fixed;inset:0;background:#000}
video{position:absolute;width:100%;height:100%;object-fit:cover}

/* TOP BAR — minimal glass pill */
.topbar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:7px 13px}
.brand-dot{width:7px;height:7px;border-radius:50%;background:#f5a623;flex-shrink:0}
.brand-dot.green{background:#34d399}
.brand-label{font-size:13px;font-weight:600;color:#fff;letter-spacing:-.01em}
.live-pill{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);background:rgba(0,0,0,.35);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px 11px;letter-spacing:.02em}
.live-pill.on{color:#34d399;border-color:rgba(52,211,153,.25)}

/* CENTER ROI */
.roi-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;display:flex;align-items:center;justify-content:center}
.roi{border:2px dashed rgba(245,166,35,.7);border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center}
.roi::after{content:"";width:5px;height:5px;border-radius:50%;background:rgba(245,166,35,.8);flex-shrink:0}
.roi.locked{border-color:rgba(99,179,237,.8);box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
.roi.detected{border-color:rgba(52,211,153,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.28),0 0 28px rgba(52,211,153,.3)}

/* COUNT bubble — big, centered near top */
.count-badge{position:fixed;top:50%;left:50%;transform:translate(-50%,-170%);z-index:20;pointer-events:none;text-align:center}
.count-num{font-size:72px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.04em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.count-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.45);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* CAPTURE TOAST */
.toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.94);opacity:0;z-index:30;pointer-events:none;background:rgba(10,20,35,.88);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(245,166,35,.35);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:13px;text-align:center;transition:opacity .15s,transform .15s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.capturing{border-color:rgba(99,179,237,.4)}
.toast-sub{display:block;font-size:10px;color:rgba(180,200,220,.7);margin-top:3px;font-weight:500}

/* METER — right side slim */
.meter-wrap{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.meter{width:4px;height:120px;border-radius:4px;background:rgba(255,255,255,.1);position:relative;overflow:visible}
.meter-fill{position:absolute;bottom:0;width:100%;border-radius:4px;background:rgba(99,179,237,.7);transition:height .08s}
.meter-base{position:absolute;left:-3px;width:10px;height:1.5px;background:rgba(245,166,35,.6)}
.meter-peak{position:absolute;left:-3px;width:10px;height:1.5px;background:rgba(255,255,255,.5)}
.meter-val{font-size:10px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.02em}

/* GRAPH — bottom strip */
.graph-wrap{position:fixed;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 100%);z-index:15;pointer-events:none}
.graph-wrap canvas{width:100%;height:100%}

/* BOTTOM CONTROLS — glass bar */
.controls{position:fixed;bottom:env(safe-area-inset-bottom,0);left:0;right:0;z-index:20;padding:0 16px 16px}
.ctrl-glass{background:rgba(12,18,28,.72);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(255,255,255,.1);border-top:1px solid rgba(255,255,255,.06);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}

/* Primary actions row */
.btn-row{display:flex;gap:10px}
.btn{border:0;border-radius:14px;padding:12px;font-weight:700;font-size:13px;flex:1;transition:transform .12s,background .15s;letter-spacing:-.01em;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-lock{background:rgba(245,166,35,1);color:#0a1020}
.btn-lock.active{background:rgba(239,100,100,.9);color:#fff}
.btn-reset{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.1)}

/* Sliders row */
.sliders{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.slider-group{display:flex;flex-direction:column;gap:5px}
.slider-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.slider-label b{color:rgba(255,255,255,.65);font-weight:700}
input[type=range]{width:100%;height:3px;accent-color:#f5a623;cursor:pointer}

/* Debug strip */
.debug{display:flex;gap:12px;flex-wrap:wrap}
.debug-item{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.03em}
.debug-item b{color:rgba(255,255,255,.6)}

/* Info overlay — left side */
.info-overlay{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.info-row{font-size:10px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.04em}
.info-row b{color:rgba(255,255,255,.65)}

/* Zoom label */
.zoom-badge{position:fixed;bottom:calc(env(safe-area-inset-bottom,0) + 190px);left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.04em;opacity:0;transition:opacity .3s}
.zoom-badge.show{opacity:1}

/* Status text */
.status-text{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);text-align:right;letter-spacing:.01em}
.status-row{display:flex;align-items:center;justify-content:space-between}

@media(max-width:400px){
  .count-num{font-size:58px}
  .sliders{grid-template-columns:1fr 1fr}
  .sliders .slider-group:last-child{grid-column:span 2}
}
</style>
</head>
<body>

<div class="stage">
  <video id="webcam" autoplay playsinline muted></video>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand-pill">
    <div id="brandDot" class="brand-dot"></div>
    <span class="brand-label">Bottle Counter</span>
  </div>
  <div id="cameraState" class="live-pill">OFF</div>
</div>

<!-- ROI circle -->
<div class="roi-wrap">
  <div id="roi" class="roi" style="width:110px;height:110px"></div>
</div>

<!-- COUNT -->
<div class="count-badge">
  <div id="count" class="count-num">0</div>
  <div class="count-sub">ขวดที่ตรวจพบ</div>
</div>

<!-- TOAST -->
<div id="captureToast" class="toast"></div>

<!-- INFO LEFT -->
<div class="info-overlay">
  <div class="info-row">SIM <b id="scoreText">0%</b></div>
  <div class="info-row">BASE <b id="baseText">0%</b></div>
  <div class="info-row">PEAK <b id="peakText">0%</b></div>
  <div class="info-row">Δ <b id="deltaText">0%</b></div>
</div>

<!-- METER RIGHT -->
<div class="meter-wrap">
  <div id="verticalScore" class="meter-val">0%</div>
  <div class="meter">
    <div id="fill" class="meter-fill"></div>
    <div id="baseLine" class="meter-base"></div>
    <div id="peakLine" class="meter-peak"></div>
  </div>
</div>

<!-- GRAPH -->
<div class="graph-wrap"><canvas id="graph"></canvas></div>

<!-- ZOOM BADGE -->
<div id="zoomBadge" class="zoom-badge">1.0×</div>

<!-- BOTTOM CONTROLS -->
<div class="controls">
  <div class="ctrl-glass">
    <div class="status-row">
      <div class="debug">
        <span class="debug-item">STATE <b id="stateDebug">IDLE</b></span>
        <span class="debug-item">CONF <b id="confDebug">0%</b></span>
        <span class="debug-item">EV <b id="eventDebug">0</b></span>
      </div>
      <div id="status" class="status-text">เปิดกล้องเพื่อเริ่ม</div>
    </div>

    <div class="btn-row">
      <button id="lockBtn" class="btn btn-lock">ล็อก Reference</button>
      <button id="resetBtn" class="btn btn-reset">รีเซ็ต</button>
    </div>

    <div class="sliders">
      <div class="slider-group">
        <div class="slider-label">วงกลม <b id="sizeLabel">110</b></div>
        <input id="sizeSlider" type="range" min="50" max="180" step="5" value="110">
      </div>
      <div class="slider-group">
        <div class="slider-label">ความไว <b id="sensLabel">กลาง</b></div>
        <input id="sensSlider" type="range" min="0" max="2" step="1" value="1">
      </div>
      <div class="slider-group">
        <div class="slider-label">ซูม <b id="zoomLabel">1.0×</b></div>
        <input id="zoomSlider" type="range" min="100" max="400" step="10" value="100">
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$("webcam"), roi=$("roi"), lockBtn=$("lockBtn"), resetBtn=$("resetBtn");
const sizeSlider=$("sizeSlider"), sensSlider=$("sensSlider"), zoomSlider=$("zoomSlider");
const canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true});
const graph=$("graph"), gctx=graph.getContext("2d");

let track=null, scanning=false, template=null, count=0;
let roiSize=110, state="IDLE", baseline=8, smooth=8, peak=8, peakDelta=0;
let history=[], lastCountTime=0, eventCount=0, audioCtx=null;
let referenceFrames=[], refCaptureLeft=0, refTargetFrames=4, refCaptureBusy=false;
let refCaptureTimer=null, refCaptureStartedAt=0, refCaptureIntervalMs=120, refCaptureMaxMs=2200;
let currentZoom=1.0, zoomTimer=null;

const sensitivity=[
  {name:"ต่ำ", rise:8, minPeakDelta:12, fall:0.58, minWidth:5, rearm:5},
  {name:"กลาง", rise:6, minPeakDelta:9, fall:0.62, minWidth:4, rearm:5},
  {name:"สูง", rise:4, minPeakDelta:7, fall:0.68, minWidth:3, rearm:4}
];

function cfg(){return sensitivity[+sensSlider.value]}

function beep(){
  try{
    audioCtx||=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880;g.gain.value=.07;o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.09);
  }catch(e){}
}

function updateROI(){
  roiSize=+sizeSlider.value;
  roi.style.width=roi.style.height=roiSize+"px";
  canvas.width=roiSize;canvas.height=roiSize;
  $("sizeLabel").textContent=roiSize;
}
function updateSens(){$("sensLabel").textContent=cfg().name}

async function applyZoom(val){
  currentZoom=val/100;
  $("zoomLabel").textContent=currentZoom.toFixed(1)+"×";
  $("zoomBadge").textContent=currentZoom.toFixed(1)+"×";
  $("zoomBadge").classList.add("show");
  clearTimeout(zoomTimer);
  zoomTimer=setTimeout(()=>$("zoomBadge").classList.remove("show"),1400);
  if(!track)return;
  const caps=track.getCapabilities&&track.getCapabilities();
  if(caps&&caps.zoom&&caps.zoom.min!=null){
    const zMin=caps.zoom.min,zMax=caps.zoom.max;
    const zTarget=zMin+(zMax-zMin)*((currentZoom-1)/3);
    try{await track.applyConstraints({advanced:[{zoom:Math.min(zMax,Math.max(zMin,zTarget))}]});}catch(e){}
  } else {
    // CSS zoom fallback — scale the video with object-fit maintain
    const s=currentZoom;
    video.style.transform=`scale(${s})`;
    video.style.transformOrigin="center center";
  }
}

zoomSlider.oninput=()=>applyZoom(+zoomSlider.value);
sizeSlider.oninput=updateROI;
sensSlider.oninput=updateSens;
updateROI();updateSens();

async function initCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    track=stream.getVideoTracks()[0];
    // Check zoom support and adjust slider max
    const caps=track.getCapabilities&&track.getCapabilities();
    if(caps&&caps.zoom&&caps.zoom.max){
      const nativeMax=caps.zoom.max;
      const sliderMax=Math.min(Math.round(nativeMax*100),500);
      zoomSlider.max=sliderMax;
    }
    $("cameraState").textContent="ON";
    $("cameraState").classList.add("on");
    $("brandDot").classList.add("green");
    requestAnimationFrame(loop);
  }catch(e){
    $("status").textContent="ไม่สามารถเปิดกล้อง: "+e.message;
  }
}

function circularImage(){
  const s=roiSize,sx=video.videoWidth/2-s/2,sy=video.videoHeight/2-s/2;
  ctx.clearRect(0,0,s,s);ctx.save();ctx.beginPath();ctx.arc(s/2,s/2,s/2,0,Math.PI*2);ctx.clip();
  ctx.drawImage(video,sx,sy,s,s,0,0,s,s);ctx.restore();
  return ctx.getImageData(0,0,s,s);
}

function features(img){
  const d=img.data,s=img.width,hist=new Array(64).fill(0),lum=[];
  let n=0,sum=0,sum2=0,edge=0;
  for(let y=1;y<s-1;y++)for(let x=1;x<s-1;x++){
    const dx=x-s/2,dy=y-s/2;if(dx*dx+dy*dy>(s/2-2)**2)continue;
    const i=(y*s+x)*4,r=d[i],g=d[i+1],b=d[i+2];
    const rr=r>>6,gg=g>>6,bb=b>>6;hist[(rr<<4)|(gg<<2)|bb]++;
    const l=.299*r+.587*g+.114*b;sum+=l;sum2+=l*l;n++;
    const l1=.299*d[i-4]+.587*d[i-3]+.114*d[i-2];
    const l2=.299*d[i+s*4]+.587*d[i+s*4+1]+.114*d[i+s*4+2];
    if(Math.abs(l-l1)+Math.abs(l-l2)>70)edge++;
  }
  hist.forEach((v,i)=>hist[i]=v/n);
  const mean=sum/n,variance=Math.max(0,sum2/n-mean*mean);
  return{hist,mean,sd:Math.sqrt(variance),edge:edge/n};
}

function histSim(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.min(a[i],b[i]);return s*100}
function featureScore(a,b){
  const color=histSim(a.hist,b.hist);
  const bright=Math.max(0,100-Math.abs(a.mean-b.mean)*1.35);
  const texture=Math.max(0,100-Math.abs(a.sd-b.sd)*1.6);
  const edge=Math.max(0,100-Math.abs(a.edge-b.edge)*600);
  return .55*color+.20*bright+.15*texture+.10*edge;
}
function smoothScore(v){smooth=smooth*.72+v*.28;return smooth}

function showCaptureToast(title,sub="",capturing=false){
  const el=$("captureToast");
  el.innerHTML=title+(sub?`<span class="toast-sub">${sub}</span>`:"");
  el.classList.toggle("capturing",capturing);
  el.classList.add("show");
}
function hideCaptureToast(){$("captureToast").classList.remove("show","capturing")}

function captureReference(){
  if(refCaptureBusy)return;
  if(!video.videoWidth||!video.videoHeight){$("status").textContent="รอกล้องพร้อมก่อน";return}
  refCaptureBusy=true;referenceFrames=[];refTargetFrames=4;refCaptureLeft=4;
  refCaptureStartedAt=performance.now();
  roi.classList.add("locked");lockBtn.textContent="กำลังล็อก…";lockBtn.disabled=true;
  showCaptureToast("กำลังล็อก Reference","เก็บภาพ 1/4",true);
  $("status").textContent="กำลังเก็บ Reference…";beep();
  const grab=()=>{
    if(!refCaptureBusy)return;
    if(video.readyState>=video.HAVE_CURRENT_DATA&&video.videoWidth){
      const f=features(circularImage());
      if(f){
        referenceFrames.push(f);
        const done=referenceFrames.length;refCaptureLeft=Math.max(0,refTargetFrames-done);
        if(done<refTargetFrames){
          lockBtn.textContent=`${done}/${refTargetFrames}`;
          showCaptureToast("กำลังล็อก Reference",`เก็บภาพ ${done+1}/${refTargetFrames}`,true);
          $("status").textContent=`กำลังเก็บ… ${done}/${refTargetFrames}`;
        }else{finishReference();return}
      }
    }
    if(performance.now()-refCaptureStartedAt>=refCaptureMaxMs){
      if(referenceFrames.length>=2)finishReference();else failReference();return;
    }
    refCaptureTimer=setTimeout(grab,refCaptureIntervalMs);
  };
  grab();
}

function failReference(){
  if(refCaptureTimer){clearTimeout(refCaptureTimer);refCaptureTimer=null;}
  refCaptureBusy=false;refCaptureLeft=0;referenceFrames=[];
  roi.classList.remove("locked");lockBtn.disabled=false;lockBtn.textContent="ล็อก Reference";
  $("status").textContent="ล็อกไม่สำเร็จ ลองใหม่";
  showCaptureToast("ล็อกไม่สำเร็จ","กดปุ่มเพื่อลองใหม่");
  setTimeout(hideCaptureToast,1200);
}

function finishReference(){
  if(refCaptureTimer){clearTimeout(refCaptureTimer);refCaptureTimer=null;}
  const f=referenceFrames;
  if(f.length<2){refCaptureBusy=false;refCaptureLeft=0;lockBtn.disabled=false;hideCaptureToast();$("status").textContent="ล็อกไม่สำเร็จ ลองใหม่";return}
  template={
    hist:Array.from({length:64},(_,i)=>f.reduce((a,x)=>a+x.hist[i],0)/f.length),
    mean:f.reduce((a,x)=>a+x.mean,0)/f.length,
    sd:f.reduce((a,x)=>a+x.sd,0)/f.length,
    edge:f.reduce((a,x)=>a+x.edge,0)/f.length
  };
  scanning=true;state="IDLE";
  baseline=Math.min(...f.map(x=>featureScore(template,x)));
  if(!isFinite(baseline))baseline=8;
  smooth=baseline;peak=baseline;peakDelta=0;history=[];
  referenceFrames=[];refCaptureLeft=0;refCaptureBusy=false;
  lockBtn.disabled=false;lockBtn.textContent="หยุดสแกน";lockBtn.classList.add("active");
  roi.classList.add("locked");$("status").textContent="กำลังสแกน";
  showCaptureToast("✓ พร้อมนับ",`${f.length} frames`);
  setTimeout(hideCaptureToast,900);beep();
}

function processEvent(score){
  const c=cfg(),prev=history.length?history[history.length-1]:score;
  const falling=prev-score>=0;
  if(state==="IDLE"){
    if(score>baseline+c.rise){state="RISING";peak=score;peakDelta=score-baseline}
  }else if(state==="RISING"){
    if(score>peak){peak=score;peakDelta=peak-baseline}
    if(falling&&peakDelta>=c.minPeakDelta)state="PEAK";
    else if(score<baseline+c.rearm)state="IDLE";
  }else if(state==="PEAK"){
    if(score>peak){peak=score;peakDelta=peak-baseline}
    if(score<peak*c.fall&&peakDelta>=c.minPeakDelta)state="FALLING";
  }else if(state==="FALLING"){
    if(score>peak*.93){state="PEAK";return}
    if(score<=baseline+c.rearm){
      const now=performance.now();
      if(now-lastCountTime>250){count++;eventCount++;lastCountTime=now;$("count").textContent=count;beep()}
      state="IDLE";peak=score;peakDelta=0;roi.classList.remove("detected");
    }
  }
  roi.classList.toggle("detected",state!=="IDLE");
}

function drawGraph(){
  const w=graph.clientWidth,h=graph.clientHeight;
  if(graph.width!==w*devicePixelRatio||graph.height!==h*devicePixelRatio){
    graph.width=w*devicePixelRatio;graph.height=h*devicePixelRatio;
    gctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  gctx.clearRect(0,0,w,h);
  if(history.length<2)return;
  gctx.strokeStyle="rgba(245,166,35,.6)";gctx.lineWidth=1.5;gctx.beginPath();
  history.forEach((v,i)=>{
    const x=i*(w/(history.length-1)),y=h-2-(Math.max(0,Math.min(100,v))/100)*(h-4);
    i?gctx.lineTo(x,y):gctx.moveTo(x,y);
  });
  gctx.stroke();
}

function loop(){
  if(video.readyState>=video.HAVE_ENOUGH_DATA){
    const img=circularImage();
    const f=features(img);
    if(scanning&&template){
      const raw=featureScore(template,f);
      const score=smoothScore(raw);
      if(state==="IDLE")baseline=baseline*.985+score*.015;
      processEvent(score);
      history.push(score);if(history.length>90)history.shift();
      peak=Math.max(peak,score);peakDelta=Math.max(0,peak-baseline);
      $("scoreText").textContent=Math.round(score)+"%";
      $("verticalScore").textContent=Math.round(score)+"%";
      $("baseText").textContent=Math.round(baseline)+"%";
      $("peakText").textContent=Math.round(peak)+"%";
      $("deltaText").textContent="+"+Math.round(peakDelta)+"%";
      $("stateDebug").textContent=state;
      $("confDebug").textContent=Math.round(Math.min(100,peakDelta*4))+"%";
      $("eventDebug").textContent=eventCount;
      $("fill").style.height=Math.min(100,score)+"%";
      $("baseLine").style.bottom=Math.min(100,baseline)+"%";
      $("peakLine").style.bottom=Math.min(100,peak)+"%";
      drawGraph();
    }
  }
  requestAnimationFrame(loop);
}

lockBtn.onclick=()=>{
  if(!scanning){
    if(!video.videoWidth){$("status").textContent="รอกล้องพร้อมก่อน";return}
    captureReference();
  }else{
    scanning=false;template=null;state="IDLE";history=[];referenceFrames=[];
    refCaptureLeft=0;refCaptureBusy=false;
    if(refCaptureTimer){clearTimeout(refCaptureTimer);refCaptureTimer=null;}
    roi.className="roi";hideCaptureToast();lockBtn.disabled=false;
    lockBtn.textContent="ล็อก Reference";lockBtn.classList.remove("active");
    $("status").textContent="หยุดการสแกน";
    $("scoreText").textContent="0%";
  }
};

resetBtn.onclick=()=>{count=0;eventCount=0;$("count").textContent="0";$("eventDebug").textContent="0"};

// Prevent zoom gestures
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey||e.deltaX!==0||e.deltaY!==0)e.preventDefault()},{passive:false});
document.addEventListener("touchmove",e=>{
  if(e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON")e.preventDefault();
},{passive:false});

window.addEventListener("DOMContentLoaded",initCamera);
</script>
